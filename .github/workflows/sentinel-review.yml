name: Sentinel PR Review Trigger

on:
  pull_request:
    types: [closed]

jobs:
  trigger-review:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Review Issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 Sentinel Review: PR #${pr.number} — ${pr.title}`,
              body: `## PR Details
            - **PR:** #${pr.number}
            - **Title:** ${pr.title}
            - **Author:** ${pr.user.login}
            - **Merged at:** ${pr.merged_at}
            - **URL:** ${pr.html_url}
            
            ## Review Status
            ⏳ Pending — Sentinel will review this PR.
            
            ## Checklist
            - [ ] Code quality review
            - [ ] Security audit
            - [ ] Architecture review
            - [ ] Performance check
            - [ ] Testing coverage`,
              labels: ['sentinel-review', 'needs-triage']
            });
